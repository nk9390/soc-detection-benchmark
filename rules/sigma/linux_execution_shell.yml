title: Linux Shell Execution
id: 9a5b8c3d-1234-5678-9abc-def012345678
status: experimental
description: Detects execution of shell interpreters (bash, sh, dash)
references:
    - https://attack.mitre.org/techniques/T1059/004/
author: SOC Detection Benchmark
date: 2024/01/15
tags:
    - attack.execution
    - attack.t1059.004
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: EXECVE
        a0|endswith:
            - '/bash'
            - '/sh'
            - '/dash'
            - '/zsh'
    filter_normal:
        a1:
            - '-c'
    condition: selection
fields:
    - a0
    - a1
    - a2
    - ppid
    - pid
    - uid
falsepositives:
    - Legitimate administrative activity
    - Automation scripts
level: low
