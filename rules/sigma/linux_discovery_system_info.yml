title: System Information Discovery
id: 70819203-789a-bcde-f012-345678901234
status: experimental
description: Detects commands commonly used for system reconnaissance
references:
    - https://attack.mitre.org/techniques/T1082/
author: SOC Detection Benchmark
date: 2024/01/15
tags:
    - attack.discovery
    - attack.t1082
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: EXECVE
        a0|endswith:
            - '/uname'
            - '/hostname'
            - '/hostnamectl'
    selection_read:
        type:
            - SYSCALL
            - PATH
        key: sys_info
    condition: selection or selection_read
fields:
    - exe
    - a0
    - a1
    - pid
    - uid
falsepositives:
    - System monitoring tools
    - Legitimate administration
level: informational
