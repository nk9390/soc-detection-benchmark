title: Suspicious File Deletion
id: 5e6f7081-5678-9abc-def0-123456789012
status: experimental
description: Detects deletion of potentially sensitive files
references:
    - https://attack.mitre.org/techniques/T1070/004/
author: SOC Detection Benchmark
date: 2024/01/15
tags:
    - attack.defense_evasion
    - attack.t1070.004
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type:
            - SYSCALL
            - PATH
        key: file_delete
    filter_tmp:
        name|startswith: '/tmp/'
    condition: selection and not filter_tmp
fields:
    - exe
    - name
    - pid
    - uid
falsepositives:
    - Normal file cleanup
    - Log rotation
level: low
